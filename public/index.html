<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal AI OS</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --user-msg: #4338ca;
      --ai-msg: #1e293b;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    header { background: #111827; border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; }
    .brand { font-weight: 700; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; display: inline-block; }
    
    .actions { display: flex; align-items: center; gap: 10px; }
    .clear-btn { background: transparent; border: 1px solid #ef4444; color: #ef4444; padding: 4px 10px; border-radius: 14px; font-size: 0.75rem; cursor: pointer; }
    .clear-btn:hover { background: #ef4444; color: white; }

    .mode-selector { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .mode-btn { background: var(--card); border: 1px solid var(--border); color: var(--text-muted); padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; white-space: nowrap; transition: 0.2s; }
    .mode-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }

    #chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .msg { max-width: 85%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 0.95rem; word-wrap: break-word; white-space: pre-wrap; }
    .msg.user { align-self: flex-end; background: var(--user-msg); color: #fff; border-bottom-right-radius: 2px; }
    .msg.ai { align-self: flex-start; background: var(--ai-msg); border: 1px solid var(--border); border-bottom-left-radius: 2px; }
    .msg.error { background: #7f1d1d; color: #fecaca; border: 1px solid #991b1b; }

    footer { padding: 12px 16px; background: #111827; border-top: 1px solid var(--border); }
    .input-box { display: flex; gap: 8px; max-width: 900px; margin: 0 auto; }
    input { flex: 1; background: var(--card); border: 1px solid var(--border); padding: 12px 16px; border-radius: 24px; color: #fff; font-size: 0.95rem; outline: none; }
    input:focus { border-color: var(--accent); }
    button.send-btn { background: var(--accent); border: none; color: #fff; padding: 0 20px; border-radius: 24px; font-weight: 600; cursor: pointer; }
    button.send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>
    <div class="top-bar">
      <div class="brand">
        <span class="status-dot"></span> Personal AI OS
      </div>
      <div class="actions">
        <button class="clear-btn" onclick="clearCurrentChat()">Clear Memory</button>
      </div>
    </div>
    <div class="mode-selector">
      <button class="mode-btn active" onclick="setMode('general', this)">🌐 General</button>
      <button class="mode-btn" onclick="setMode('pcs', this)">📚 PCS Mentor</button>
      <button class="mode-btn" onclick="setMode('freelance', this)">💻 Freelancing & Dev</button>
      <button class="mode-btn" onclick="setMode('life', this)">⚡ Life & Discipline</button>
    </div>
  </header>

  <div id="chat-container"></div>

  <footer>
    <form class="input-box" onsubmit="sendMessage(event)">
      <input type="text" id="userInput" placeholder="Ask anything..." autocomplete="off" />
      <button type="submit" class="send-btn" id="sendBtn">Send</button>
    </form>
  </footer>

  <script>
    let currentMode = 'general';
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    const DEFAULT_GREETINGS = {
      general: "नमस्कार! मैं आपका पर्सनल AI OS हूँ। आज क्या प्लान है?",
      pcs: "नमस्ते! PCS मेंटर मोड सक्रिय है। सिलेबस, GS नोट्स या उत्तर लेखन से शुरुआत करें।",
      freelance: "Dev & Freelancing मोड तैयार है। प्रोजेक्ट, कोड आर्किटेक्चर या क्लाइंट वर्क बताइए।",
      life: "Life & Discipline मोड ऑन है। आज का रूटीन, गोल या टाइम-ब्लॉक सेट करें।"
    };

    function getHistory() {
      const saved = localStorage.getItem(`chat_history_${currentMode}`);
      if (saved) {
        try { return JSON.parse(saved); } catch (e) { return []; }
      }
      return [];
    }

    function loadChatHistory() {
      chatContainer.innerHTML = '';
      const history = getHistory();
      if (history.length > 0) {
        history.forEach(m => appendMessage(m.text, m.sender, false));
      } else {
        appendMessage(DEFAULT_GREETINGS[currentMode], 'ai', false);
      }
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function saveMessageToVault(text, sender) {
      let history = getHistory();
      history.push({ text, sender, time: new Date().toISOString() });
      localStorage.setItem(`chat_history_${currentMode}`, JSON.stringify(history));
    }

    function clearCurrentChat() {
      if (confirm(`क्या आप ${currentMode.toUpperCase()} मोड की पूरी मेमोरी मिटाना चाहते हैं?`)) {
        localStorage.removeItem(`chat_history_${currentMode}`);
        loadChatHistory();
      }
    }

    function setMode(mode, element) {
      if (currentMode === mode) return;
      currentMode = mode;
      document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
      loadChatHistory();
    }

    function appendMessage(text, sender, persist = true) {
      const msg = document.createElement('div');
      msg.className = `msg ${sender}`;
      msg.textContent = text;
      chatContainer.appendChild(msg);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      if (persist) saveMessageToVault(text, sender);
      return msg;
    }

    async function sendMessage(e) {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text) return;

      // भेजने से पहले की पूरी हिस्ट्री ले लें ताकि बैकएंड को भेजा जा सके
      const previousHistory = getHistory();

      appendMessage(text, 'user', true);
      userInput.value = '';
      sendBtn.disabled = true;

      const aiMsgElement = appendMessage('...', 'ai', false);

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            message: text, 
            mode: currentMode,
            history: previousHistory 
          })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let fullText = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value);
          const lines = chunk.split('\n');

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const dataStr = line.replace('data: ', '').trim();
              if (dataStr === '[DONE]') continue;
              try {
                const parsed = JSON.parse(dataStr);
                if (parsed.error) {
                  aiMsgElement.className = 'msg ai error';
                  aiMsgElement.textContent = parsed.error;
                  break;
                }
                if (parsed.text) {
                  fullText += parsed.text;
                  aiMsgElement.textContent = fullText;
                  chatContainer.scrollTop = chatContainer.scrollHeight;
                }
              } catch (err) {}
            }
          }
        }
        if (fullText) saveMessageToVault(fullText, 'ai');
      } catch (err) {
        aiMsgElement.className = 'msg ai error';
        aiMsgElement.textContent = 'Network error: ' + err.message;
      } finally {
        sendBtn.disabled = false;
        userInput.focus();
      }
    }

    loadChatHistory();
  </script>
</body>
</html>
