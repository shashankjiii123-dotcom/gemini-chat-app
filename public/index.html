<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini AI Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f1117; color: #fff; height: 100dvh; display: flex; flex-direction: column; }
    header { padding: 16px; border-bottom: 1px solid #232734; display: flex; align-items: center; justify-content: space-between; }
    .status { font-size: 13px; color: #4ade80; display: flex; align-items: center; gap: 6px; }
    .status::before { content: ""; width: 8px; height: 8px; background: #4ade80; border-radius: 50%; display: inline-block; }
    #chat-box { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .msg { max-width: 85%; padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.5; white-space: pre-wrap; }
    .user { align-self: flex-end; background: #5b21b6; color: #fff; border-bottom-right-radius: 4px; }
    .bot { align-self: flex-start; background: #1e2230; color: #e2e8f0; border-bottom-left-radius: 4px; }
    .error { color: #f87171; }
    form { display: flex; gap: 8px; padding: 12px; background: #161922; border-top: 1px solid #232734; }
    input { flex: 1; padding: 12px 16px; border-radius: 24px; border: 1px solid #2e3446; background: #0f1117; color: #fff; font-size: 15px; outline: none; }
    button { padding: 12px 20px; border-radius: 24px; border: none; background: #7c3aed; color: #fff; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h3>Gemini Assistant</h3>
    <div class="status">Online</div>
  </header>
  <div id="chat-box">
    <div class="msg bot">Hello! Ask me anything to get started.</div>
  </div>
  <form id="form">
    <input id="input" type="text" placeholder="Ask a question..." autocomplete="off" required />
    <button type="submit">Send</button>
  </form>

  <script>
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const chatBox = document.getElementById('chat-box');

    function appendMessage(text, role) {
      const msg = document.createElement('div');
      msg.className = `msg ${role}`;
      msg.textContent = text;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msg;
    }

    form.onsubmit = async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      
      appendMessage(text, 'user');
      input.value = '';
      
      const botMsg = appendMessage('', 'bot');

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let partialData = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          partialData += decoder.decode(value, { stream: true });
          const lines = partialData.split('\n');
          partialData = lines.pop(); // अधूरा चंक संभालें

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const dataStr = line.replace('data: ', '').trim();
              if (dataStr === '[DONE]') break;
              try {
                const parsed = JSON.parse(dataStr);
                if (parsed.text) botMsg.textContent += parsed.text;
                if (parsed.error) {
                  botMsg.textContent = parsed.error;
                  botMsg.classList.add('error');
                }
              } catch (_) {}
              chatBox.scrollTop = chatBox.scrollHeight;
            }
          }
        }
      } catch (err) {
        botMsg.textContent = 'Connection error: ' + err.message;
        botMsg.classList.add('error');
      }
    };
  </script>
</body>
</html>
